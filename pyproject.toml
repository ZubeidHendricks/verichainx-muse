[project]
name = "verichainx-muse"
version = "0.1.0"
description = "Trust layer for agentic shopping: product verification, seller risk and Hedera-anchored provenance, served over MCP and REST."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.154.0",
    "hiero-sdk-python>=0.3.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "openai>=3.35.1",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[project.scripts]
verichainx-mcp = "verichainx.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verichainx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
