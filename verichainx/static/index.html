<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VeriChainX</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%231f5c4a%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <header>
    <div>
      <h1>VeriChainX</h1>
      <div class="muted">A trust check your shopping agent runs before checkout.</div>
    </div>
    <span id="engine" class="tag">connecting…</span>
  </header>

  <form class="ask" id="ask">
    <input id="query" value="Find me an authentic designer handbag under $800" aria-label="Shopping request">
    <button class="primary" id="go">Ask agent</button>
  </form>

  <ul class="trace" id="trace"></ul>
  <section id="results"></section>

  <p class="disclaimer">
    Scores are evidence-based estimates, not guarantees. A Hedera record proves what was checked and when,
    not that an item is genuine.
  </p>
</main>
<script src="/static/app.js"></script>
</body>
</html>
