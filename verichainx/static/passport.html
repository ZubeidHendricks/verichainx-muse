<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Passport</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%231f5c4a%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <header>
    <div>
      <h1>Product passport</h1>
      <div class="muted mono" id="key"></div>
    </div>
    <a href="/">VeriChainX</a>
  </header>
  <section id="records"><p class="muted">Loading…</p></section>
  <p class="disclaimer">
    Each entry is a VeriChainX assessment whose hash is anchored on Hedera. “Verified” means the record
    is unchanged since it was anchored. It proves what was checked and when, not that the item is genuine.
  </p>
</main>
<script>
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const key = decodeURIComponent(location.pathname.split("/").pop());
document.getElementById("key").textContent = key;

(async () => {
  const root = document.getElementById("records");
  const res = await fetch(`/v1/passports/${encodeURIComponent(key)}`);
  if (!res.ok) { root.innerHTML = `<p>No records for this product.</p>`; return; }
  const { records } = await res.json();
  const checks = await Promise.all(records.map((r) => fetch(`/v1/records/${r.record_id}/provenance`).then((x) => x.json())));
  root.innerHTML = records.map((r, i) => {
    const rec = r.record, p = rec.product, s = rec.seller, c = checks[i], a = c.anchor;
    const chain = a.status === "anchored"
      ? `topic ${esc(a.topic_id)} #${a.sequence_number} · <a href="${esc(a.explorer_url)}" target="_blank" rel="noopener">HashScan</a>`
      : esc(a.status);
    return `<article class="card" style="grid-template-columns:1fr">
      <div>
        <div class="head"><h2>${esc(p.brand)} ${esc(p.model)}</h2><span class="tag">${esc(c.status)}</span></div>
        <div class="muted">${esc(rec.issued_at)} · decision: ${esc(rec.decision)}</div>
        <div class="scores">
          <div class="meter"><div class="label">Product verdict</div><div class="value">${esc(p.verdict.replace("_", " "))}</div>
            <div class="muted">${p.authenticity_score}/100 · ${esc(p.confidence)} confidence · ${p.evidence.length} evidence regions</div></div>
          <div class="meter"><div class="label">Seller risk</div><div class="value">${s ? s.risk_score + "/100" : "n/a"}</div>
            <div class="muted">${s ? esc(s.risk_level) + " · " + esc(s.seller_id) : ""}</div></div>
        </div>
        <dl class="record">
          <dt>Record</dt><dd class="mono">${esc(r.record_id)}</dd>
          <dt>SHA-256</dt><dd class="mono">${esc(c.record_hash)}</dd>
          <dt>On Hedera</dt><dd>${chain}</dd>
          <dt>Models</dt><dd class="mono">${esc(Object.values(p.models).join(" + "))} (${esc(p.engine)}${p.fallback_used ? ", rule-based fallback" : ""})</dd>
        </dl>
      </div></article>`;
  }).join("");
})();
</script>
</body>
</html>
